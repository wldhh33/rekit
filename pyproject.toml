[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rekit"
version = "0.6.0"
description = "Modular binary analysis pipeline: triage → unpack → symbols → report, every conclusion traceable to bytes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wldhh33" }]
keywords = ["reverse-engineering", "pe", "malware-analysis", "binary-analysis", "triage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
funcs = ["capstone>=5"]

[project.scripts]
rekit = "rekit.cli:main"

[tool.setuptools.packages.find]
include = ["rekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
