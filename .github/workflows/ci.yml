name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # 冒烟：确保 CLI 入口与报告渲染没被改坏
      - name: Smoke
        run: |
          python -m rekit triage tests/fixtures/hello_rs.exe tests/fixtures/hello_rs.packed.exe -o out.json -m out.md
          grep -q '"verdict": "upx"' out.json
          grep -q 'UPX' out.md

      - name: Example
        run: python examples/triage_demo.py

# 说明：
#   v0.1 不依赖 Ghidra / JDK / UPX，CI 只跑 triage 与解析器测试。
#   symbols（v0.3）相关测试将在独立 job 里用带 Ghidra 的镜像跑，未就绪前不进 CI。
