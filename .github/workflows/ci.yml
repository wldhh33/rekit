name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,funcs]"

      - name: Test
        # 共享 runner 的时延噪声会随机击穿性能门（见 0.6.1 CHANGELOG），
        # 性能门只在固定机器上跑；CI 只保证正确性测试。
        env:
          REKIT_SKIP_PERF: "1"
        run: python -m pytest -q

      # 冒烟：确保 CLI 入口与报告渲染没被改坏
      - name: Smoke
        run: |
          python -m rekit triage tests/fixtures/hello_rs.exe tests/fixtures/hello_rs.packed.exe -o out.json -m out.md
          grep -q '"verdict": "upx"' out.json
          grep -q 'UPX' out.md
          python -m rekit funcs tests/fixtures/hello_elf --json out_funcs.json --csv out_funcs.csv
          grep -q '".eh_frame"' out_funcs.json
          grep -q '^file,' out_funcs.csv

      - name: Example
        run: python examples/triage_demo.py

# 说明：
#   v0.1 不依赖 Ghidra / JDK / UPX，CI 只跑 triage 与解析器测试。
#   symbols（v0.3）相关测试将在独立 job 里用带 Ghidra 的镜像跑，未就绪前不进 CI。
